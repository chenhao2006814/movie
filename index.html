<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>影视聚合搜索</title>
    <link rel="stylesheet" href="style.css">
    <!-- 引入 DPlayer 和 Hls.js 用于播放 m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/dplayer@latest/dist/DPlayer.min.js"></script>
</head>
<body>

    <!-- 顶部标题 -->
    <header class="app-header">
        <h1>影视聚合搜索</h1>
        <div class="sub-title">聚合搜索源 · 一键检索</div>
    </header>

    <!-- 源卡片区 -->
    <section class="source-section">
        <div class="source-grid" id="sourceGrid">
            <!-- 假数据源卡片 -->
            <div class="source-card active" onclick="selectSource(this)">天涯资源</div>
            <div class="source-card" onclick="selectSource(this)">360资源</div>
            <div class="source-card" onclick="selectSource(this)">非凡资源</div>
            <!-- 管理员专属的加号卡片 -->
            <div class="source-card add-btn" id="addSourceBtn" onclick="openAdminModal()">
                <span class="plus-icon"></span>
            </div>
        </div>
    </section>

    <!-- 搜索区 -->
    <section class="search-section">
        <div class="search-bar">
            <div class="search-dropdown" id="searchTypeBtn">
                <span id="searchTypeText">当前资源</span>
                <span class="arrow">▼</span>
                <div class="dropdown-menu" id="dropdownMenu">
                    <div class="dropdown-item active" data-type="current">当前资源</div>
                    <div class="dropdown-item" data-type="all">全站搜索</div>
                </div>
            </div>
            <input type="text" id="searchInput" placeholder="输入关键词搜索...">
            <button class="search-btn" id="searchBtn">搜索</button>
        </div>
    </section>

    <!-- 分类导航区 -->
    <section class="category-nav" id="categoryNav">
        <div class="cat-item active">最新</div>
        <div class="cat-item">电影</div>
        <div class="cat-item">电视剧</div>
        <div class="cat-item">动漫</div>
    </section>

    <!-- 主展示区 -->
    <main class="main-content" id="mainContent">
        <!-- 状态①：主页展示 -->
        <div id="viewHome" class="view-section">
            <div class="poster-grid">
                <div class="poster-card" onclick="log('点击了海报：一部好看的电影')">
                    <div class="poster-img-wrap">
                        <img src="https://via.placeholder.com/300x400/e0c3a6/fff?text=Poster">
                        <span class="poster-tag">电影</span>
                    </div>
                    <div class="poster-name">一部好看的电影名字很长很长</div>
                </div>
                <div class="poster-card" onclick="log('点击了海报：狂飙')">
                    <div class="poster-img-wrap">
                        <img src="https://via.placeholder.com/300x400/e0c3a6/fff?text=Poster">
                        <span class="poster-tag">更新至24集</span>
                    </div>
                    <div class="poster-name">狂飙</div>
                </div>
                <div class="poster-card" onclick="log('点击了海报：繁花')">
                    <div class="poster-img-wrap">
                        <img src="https://via.placeholder.com/300x400/e0c3a6/fff?text=Poster">
                        <span class="poster-tag">电视剧</span>
                    </div>
                    <div class="poster-name">繁花</div>
                </div>
            </div>
        </div>

        <!-- 状态③：全站搜索结果 -->
        <div id="viewAllSearch" class="view-section" style="display:none;">
            <h2 class="search-title">搜索结果：狂飙</h2>
            <div class="source-grid summary-grid">
                <div class="source-card active">天涯 (12条)</div>
                <div class="source-card">360 (5条)</div>
            </div>

            <div class="group-section">
                <div class="group-header">
                    <h3>天涯资源</h3>
                    <span class="all-btn" onclick="log('点击了天涯的全部结果')">全部结果 ></span>
                </div>
                <div class="poster-grid">
                    <div class="poster-card"><div class="poster-img-wrap"><img src="https://via.placeholder.com/300x400/e0c3a6/fff?text=Poster"><span class="poster-tag">电影</span></div><div class="poster-name">狂飙</div></div>
                    <div class="poster-card"><div class="poster-img-wrap"><img src="https://via.placeholder.com/300x400/e0c3a6/fff?text=Poster"><span class="poster-tag">电影</span></div><div class="poster-name">狂飙</div></div>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="app-footer">
        <span>今日访客：0 人</span> | <span>影视聚合搜索 · 自用版</span>
    </footer>

    <!-- ================= 所有弹窗集中放这里 ================= -->

    <!-- 管理员登录/添加源 弹窗 -->
    <div class="modal-overlay" id="adminModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">管理员登录</h3>
                <span class="guest-btn" id="guestBtn" style="display:none;" onclick="logoutAdmin()">游客</span>
            </div>
            
            <div id="loginView">
                <div style="position: relative;">
                    <input type="password" id="pwdInput" placeholder="请输入管理员密码 (123456)" style="margin-bottom: 12px; padding-right: 40px; width: 100%;">
                    <span id="togglePwd" style="position: absolute; right: 12px; top: 12px; cursor: pointer; font-size: 16px; color: #888;">👁</span>
                </div>
                <div class="modal-btns">
                    <button class="btn-cancel" onclick="closeAdminModal()">取消</button>
                    <button class="btn-confirm" onclick="checkLogin()">登录</button>
                </div>
            </div>

            <div id="addView" style="display:none;">
                <input type="text" id="addName" placeholder="源名称（例：天涯）">
                <input type="text" id="addApi" placeholder="API 接口地址">
                <div class="modal-btns">
                    <button class="btn-cancel" onclick="closeAdminModal()">取消</button>
                    <button class="btn-confirm" onclick="submitAddSource()">确认添加</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 编辑源弹窗 -->
    <div class="modal-mask" id="editModal">
        <div class="modal-box">
            <h3>编辑搜索源</h3>
            <input type="text" id="editName" placeholder="源名称">
            <input type="text" id="editApi" placeholder="API 接口地址">
            <input type="hidden" id="editIndex">
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeEditModal()">取消</button>
                <button class="btn-confirm" onclick="saveEdit()">保存修改</button>
            </div>
        </div>
    </div>

    <!-- 删除确认弹窗 -->
    <div class="modal-mask" id="deleteModal">
        <div class="modal-box" style="text-align: center;">
            <h3>确定要删除吗？</h3>
            <p style="font-size: 13px; color: #888; margin-bottom: 16px;">删除后该源的资源将无法搜索</p>
            <input type="hidden" id="deleteIndex">
            <div class="modal-btns" style="justify-content: center;">
                <button class="btn-cancel" onclick="closeDeleteModal()">取消</button>
                <button class="btn-confirm" style="background: #f53f3f;" onclick="confirmDelete()">确认删除</button>
            </div>
        </div>
    </div>

    <!-- 🚀 影视详情与播放弹窗 (新增) -->
    <div class="modal-mask" id="playerModal" style="background: rgba(0,0,0,0.95); z-index: 500; align-items: flex-start; padding-top: 20px;">
        <div style="width: 95%; max-width: 600px; margin: 0 auto; padding-bottom: 40px;">
            <!-- 播放器容器 -->
            <div id="dplayer" style="width: 100%; aspect-ratio: 16/9; background: #000; margin-bottom: 15px; border-radius: 8px; overflow: hidden;"></div>
            
            <h2 id="playTitle" style="color: #fff; font-size: 18px; margin-bottom: 10px;">电影名称</h2>
            <p id="playDesc" style="color: #aaa; font-size: 13px; line-height: 1.6; margin-bottom: 20px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;">剧情简介...</p>
            
            <!-- 剧集列表 -->
            <h3 style="color: var(--theme-color); font-size: 15px; margin-bottom: 10px;">选集播放</h3>
            <div id="playEpisodes" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 30px;">
                <!-- JS 会动态塞入剧集按钮 -->
            </div>
            
            <!-- 关闭按钮 -->
            <button onclick="history.back()" style="width: 100%; padding: 12px; background: #333; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer;">关闭播放器</button>
        </div>
    </div>

    <!-- Toast 提示框 -->
    <div id="toastMsg" style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; z-index: 9999; display: none; transition: opacity 0.3s;">提示信息</div>

    <!-- 🚀 移动端专属调试窗口 -->
    <div id="debugBox">
        <div style="display:flex; justify-content:space-between; border-bottom:1px solid #333; padding-bottom:4px; margin-bottom:4px;">
            <span>Debug Console</span>
            <span style="cursor:pointer;" onclick="document.getElementById('debugBox').style.display='none'">✖</span>
        </div>
        <div id="debugContent">【调试窗口已启动】</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
